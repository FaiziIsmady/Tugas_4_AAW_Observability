global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "catalog-service"
    static_configs:
      - targets: ["catalog-service:3001"]

  - job_name: "order-service"
    static_configs:
      - targets: ["order-service:3002"]

  - job_name: "inventory-service"
    static_configs:
      - targets: ["inventory-service:3004"]

  - job_name: "notification-service"
    static_configs:
      - targets: ["notification-service:3003"]
